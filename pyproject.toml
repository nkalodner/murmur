[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "murmur-dictation"
version = "0.15.1"
description = "Local push-to-talk dictation for Windows and macOS. Hold a key, talk, release; the words land at your cursor. Runs NVIDIA Parakeet, Whisper, or Canary on your machine."
readme = "README.md"
requires-python = ">=3.10,<3.14"
# Exact direct pins keep archive installs reproducible. Dependabot owns
# upgrades; uv.lock pins the complete transitive graph used by CI.
dependencies = [
    "onnx-asr[cpu,hub]==0.12.0",
    "sounddevice==0.5.6",
    "soxr==1.1.0",
    "pynput==1.8.2",
    "pystray==0.19.5",
    "pillow==12.3.0",
    "pyperclip==1.11.0",
]

[project.scripts]
murmur = "murmur.app:main"

# Windows-only windowless launcher (no console window), so Murmur can run from
# the tray with the terminal closed and start silently at login. Identical to
# `murmur` everywhere else.
[project.gui-scripts]
murmurw = "murmur.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/murmur"]

[dependency-groups]
# Test-only. The suite covers the pure logic (formatting, dictionary, chunking,
# config, sounds) and the recording pill without pulling the heavy audio/ML
# stack, so `numpy` + `pillow` + `pynput` + `pytest` is enough to run it.
dev = ["pytest>=8", "numpy", "pillow>=10", "pynput>=1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
